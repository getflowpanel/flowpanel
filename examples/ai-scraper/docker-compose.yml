services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: fp
      POSTGRES_DB: ai_scraper
    ports:
      - "54329:5432"
    volumes:
      - ai_scraper_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d ai_scraper"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  ai_scraper_data:
