name: quality-gates
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-any-in-public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check for `any` in public index.ts files
        run: |
          set -e
          # Catch `: any` / `:any` type annotations and `as any` casts.
          # \bany\b avoids matching identifiers like `anyOf` or `Company`.
          pattern=':[[:space:]]*any\b|\bas[[:space:]]+any\b'
          found=0
          for idx in packages/*/src/index.ts; do
            if grep -qnE "$pattern" "$idx" 2>/dev/null; then
              echo "❌ $idx contains \`any\` in public exports"
              grep -nE "$pattern" "$idx"
              found=1
            fi
          done
          if [ "$found" = "1" ]; then exit 1; fi
          echo "✔ No \`any\` in public exports"

  no-inline-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check for style={{ in packages/react
        run: |
          # Catch both `style={{` and `style={ {` (whitespace before inner brace).
          pattern='style=\{[[:space:]]*\{'
          if grep -rqnE "$pattern" packages/react/src 2>/dev/null; then
            echo "❌ inline styles found — use Tailwind classes + design tokens"
            grep -rnE "$pattern" packages/react/src
            exit 1
          fi
          echo "✔ No inline styles found"

  no-hardcoded-rgba-white:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check for rgba(255,255,255 / rgba(0,0,0 in .ts/.tsx files
        run: |
          if grep -rnE "rgba\(\s*255,\s*255,\s*255|rgba\(\s*0,\s*0,\s*0" \
               --include="*.ts" --include="*.tsx" packages/react/src 2>/dev/null | grep -q .; then
            echo "❌ hardcoded rgba found in TypeScript sources — use design tokens"
            grep -rnE "rgba\(\s*255,\s*255,\s*255|rgba\(\s*0,\s*0,\s*0" \
              --include="*.ts" --include="*.tsx" packages/react/src
            exit 1
          fi
          echo "✔ No hardcoded rgba found in TypeScript sources"

  import-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - run: pnpm tsx scripts/check-import-boundaries.ts

  file-size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - run: pnpm tsx scripts/check-file-sizes.ts

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - name: Build flowpanel umbrella + deps
        # `flowpanel...` builds the umbrella AND its workspace deps in topo
        # order — building it alone races the not-yet-built @flowpanel/* .d.ts
        # on a cold CI checkout.
        run: pnpm --filter "flowpanel..." build
      - name: Check bundle sizes against .size-limit.json budgets
        # Run size-limit directly. The andresz1/size-limit-action wrapper
        # shells out to npm, which chokes on pnpm `workspace:*` deps
        # (EUNSUPPORTEDPROTOCOL). We lose the per-PR delta comment but keep
        # a working hard gate.
        run: pnpm --filter flowpanel exec size-limit
