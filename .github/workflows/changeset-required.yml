name: changeset-required
on:
  pull_request:
    paths:
      - "packages/*/src/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  require-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Check for changeset
        run: |
          changed=$(ls .changeset/*.md 2>/dev/null | grep -v README | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "❌ No changeset found. Run 'pnpm changeset' and include the file in your PR."
            echo "   Or add the 'skip-changeset' label to the PR to bypass."
            exit 1
          fi
          echo "✔ Changeset found"
