name: site-quality

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/workflows/site-quality.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: typecheck · lint · boundaries · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm --filter @flowpanel/site typecheck

      - name: Lint (Biome)
        run: pnpm --filter @flowpanel/site lint

      - name: Import boundaries (FSD-light)
        run: pnpm --filter @flowpanel/site boundaries

      - name: Circular imports (madge)
        run: pnpm dlx madge --circular --extensions ts,tsx apps/site/src/

      - name: Build
        run: pnpm --filter @flowpanel/site build
