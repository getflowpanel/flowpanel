name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # ── Build + typecheck + lint + unit tests + publish/type gates ────────────
  check:
    name: Build, test & quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:unit

      # ── Publish-readiness gates (scripts added by package owners) ──────────
      - name: publint (package.json export correctness)
        run: pnpm -r --filter "./packages/*" --filter "!@flowpanel/e2e" run lint:publish

      - name: attw (are-the-types-wrong)
        run: pnpm -r --filter "./packages/*" --filter "!@flowpanel/e2e" run lint:attw

      - name: Type tests (tsd)
        run: pnpm -r test:types

      # ── Quality gates (folded in from the old quality-gates workflow so they
      #    run on the already-installed/built tree and gate via ci-success) ───
      - name: No `any` in public index.ts exports
        run: |
          pattern=':[[:space:]]*any\b|\bas[[:space:]]+any\b'
          found=0
          for idx in packages/*/src/index.ts; do
            if grep -qnE "$pattern" "$idx" 2>/dev/null; then
              echo "❌ $idx contains \`any\` in public exports"
              grep -nE "$pattern" "$idx"
              found=1
            fi
          done
          if [ "$found" = "1" ]; then exit 1; fi
          echo "✔ No \`any\` in public exports"

      - name: No inline styles in packages/react
        run: |
          if grep -rqnE 'style=\{[[:space:]]*\{' packages/react/src 2>/dev/null; then
            echo "❌ inline styles found — use Tailwind classes + design tokens"
            grep -rnE 'style=\{[[:space:]]*\{' packages/react/src
            exit 1
          fi
          echo "✔ No inline styles found"

      - name: No hardcoded rgba in packages/react
        run: |
          if grep -rnE "rgba\(\s*255,\s*255,\s*255|rgba\(\s*0,\s*0,\s*0" --include="*.ts" --include="*.tsx" packages/react/src 2>/dev/null | grep -q .; then
            echo "❌ hardcoded rgba found — use design tokens"
            grep -rnE "rgba\(\s*255,\s*255,\s*255|rgba\(\s*0,\s*0,\s*0" --include="*.ts" --include="*.tsx" packages/react/src
            exit 1
          fi
          echo "✔ No hardcoded rgba found"

      - name: Import boundaries
        run: pnpm tsx scripts/check-import-boundaries.ts

      - name: File-size budget
        run: pnpm tsx scripts/check-file-sizes.ts

      - name: Bundle-size budgets (.size-limit.json)
        run: pnpm --filter flowpanel exec size-limit

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/*/dist
          key: dist-${{ github.sha }}

  # ── E2E tests against freelance-radar ────────────────────────────────────
  # Boots the actual freelance-radar example with a real Postgres service,
  # runs db:push + seed, then runs Playwright (config in packages/e2e/
  # spawns `pnpm --filter freelance-radar dev` as its webServer).
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freelance_radar
          POSTGRES_USER: fp
          POSTGRES_PASSWORD: fp
        ports: ["54329:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fp:fp@localhost:54329/freelance_radar
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 pnpm install --frozen-lockfile

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/*/dist
          key: dist-${{ github.sha }}

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: packages/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: packages/e2e
        run: pnpm exec playwright install-deps chromium

      - name: Apply Drizzle schema to freelance-radar DB
        working-directory: examples/freelance-radar
        run: pnpm db:push

      - name: Seed freelance-radar DB
        working-directory: examples/freelance-radar
        run: pnpm db:seed

      - name: Run Playwright (boots freelance-radar via webServer)
        working-directory: packages/e2e
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

  # ── macOS smoke test (main only) ─────────────────────────────────────────
  macos:
    name: macOS smoke test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:unit

  # ── Aggregate gate: a single required status for branch protection ───────
  ci-success:
    name: CI success
    if: always()
    needs: [check, e2e, macos]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # macos only runs on main; allow it to be skipped on PRs.
          allowed-skips: macos
          jobs: ${{ toJSON(needs) }}
