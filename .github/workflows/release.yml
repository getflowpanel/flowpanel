name: release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Confirm CI passed for the current main commit
        id: verified_head
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main advanced after this CI run; the newer run will handle release"
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.verified_head.outputs.current == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.verified_head.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5.2 is required for OIDC trusted publishing.
      - if: steps.verified_head.outputs.current == 'true'
        run: npm i -g npm@^11.5.2
      - if: steps.verified_head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.verified_head.outputs.current == 'true'
        run: pnpm -r --filter "./packages/*" run build
      # After the build: the docs check resolves re-exports through the packages'
      # own entry points, which do not exist until their dist does.
      - if: steps.verified_head.outputs.current == 'true'
        run: pnpm check:release && pnpm check:docs
      - name: Create release PR or publish
        if: steps.verified_head.outputs.current == 'true'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # requires npm trusted publisher configured on npmjs.com
          version: pnpm version-packages
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
