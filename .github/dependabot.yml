version: 2
updates:
  # GitHub Actions SHAs — one grouped PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # All npm/pnpm deps (prod + dev) batched into ONE PR. Major versions are
  # excluded on purpose — bump Next.js / React / etc. deliberately, not via
  # automated PRs.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore"
