# Path-based PR labels, consumed by actions/labeler@v5.
# Syntax: <label>: [ { changed-files: [ { any-glob-to-any-file: [...] } ] } ]

"pkg:core":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/core/**"

"pkg:next":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/next/**"

"pkg:react":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/react/**"

"pkg:adapter":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/adapter-drizzle/**"
          - "packages/adapter-prisma/**"
          - "packages/adapter-bullmq/**"

"docs":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/site/**"

"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
