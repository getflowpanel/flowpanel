name: Feature request
description: Suggest an addition or change to FlowPanel
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, please skim the [documentation](https://flowpanel.tech/docs)
        and browse [GitHub Discussions](https://github.com/getflowpanel/flowpanel/discussions)
        — your feature may already be planned, deferred, or under discussion.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Be specific about the use case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What would the API look like? Code snippets are welcome.
        Bias toward additive changes over breaking changes.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        What workarounds exist today? Why aren't they good enough?
        (This often clarifies the actual need.)

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the [documentation](https://flowpanel.tech/docs) and [Discussions](https://github.com/getflowpanel/flowpanel/discussions) — this isn't already planned or deferred.
          required: true
        - label: I'm willing to send a PR if the design is approved.
          required: false
