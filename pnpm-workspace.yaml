packages:
  - "packages/*"
  - "examples/*"
  - "apps/*"

# Allow these native deps to run their install/build scripts (pnpm v10 blocks
# them by default). `better-sqlite3` compiles a native addon that the
# adapter-drizzle SQLite integration tests load; without this the test suite
# fails to locate the bindings file.
onlyBuiltDependencies:
  - better-sqlite3

catalog:
  typescript: ^5.9.3
  vitest: ^3.2.6
  tsup: ^8.3.0
  tsd: ^0.33.0
  "@types/node": ^22.0.0
  "@types/react": ^19.2.16
  "@types/react-dom": ^19.0.0
